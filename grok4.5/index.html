<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shock Marines — Prototype (Phase 0)</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0f;
        font-family: system-ui, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #seed-display {
        position: absolute;
        left: 12px;
        bottom: 12px;
        color: #c8d0e0;
        font-size: 13px;
        font-family: ui-monospace, monospace;
        background: rgba(0, 0, 0, 0.55);
        padding: 6px 10px;
        border-radius: 4px;
        pointer-events: none;
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="seed-display">seed: —</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
